[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nrvpy"
version = "0.1.0"
description = "Halo Occupation Distribution (HOD) code for modeling galaxy-halo connections in cosmological simulations"
readme = "README.md"
authors = [
    {name = "NRVpy Development Team", email = "your.email@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["cosmology", "halo occupation distribution", "HOD", "galaxy clustering", "galaxy-galaxy lensing"]
requires-python = ">=3.11"

dependencies = [
    # Core numerics
    "numpy>=2.0.0",
    "scipy>=1.12.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    # JAX ecosystem
    "jax>=0.8.0",
    "jaxlib>=0.8.0",
    "flax>=0.8.0",
    "optax>=0.2.0",
    "interpax>=0.1.0",
    # Cosmology
    "pyccl>=3.0.0",
    # Simulation I/O
    "h5py>=3.0.0",
    "swiftsimio>=7.0.0",
    "unyt>=2.9.0",
    # N-body / pair counting
    "pycorr>=0.3.0",
    "pysco-nbody>=0.1.0",
    # Fitting
    "nautilus-sampler>=1.0.0",
    "iminuit>=2.0.0",
    # JIT compilation
    "numba>=0.59.0",
    # Beyond-linear halo bias
    "dark_emulator",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]
docs = [
    "sphinx>=4.5.0",
    "sphinx-rtd-theme>=1.0.0",
    "numpydoc>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/NRV_HOD"
Documentation = "https://nrvpy.readthedocs.io"
Repository = "https://github.com/yourusername/NRV_HOD.git"
Issues = "https://github.com/yourusername/NRV_HOD/issues"

[tool.setuptools]
packages = ["HOD_NRV"]

[tool.setuptools.package-data]
HOD_NRV = ["*.dat", "*.txt", "data/**/*"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["HOD_NRV/test"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
