[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nrvpy"
version = "0.1.0"
description = "Halo Occupation Distribution (HOD) code for modeling galaxy-halo connections in cosmological simulations"
readme = "README.md"
authors = [
    {name = "NRVpy Development Team", email = "your.email@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["cosmology", "halo occupation distribution", "HOD", "galaxy clustering", "galaxy-galaxy lensing"]
requires-python = ">=3.8"

dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "numba>=0.55.0",
    "astropy>=4.3.0",
    "colossus>=1.3.0",
    "pycorr>=0.3.0",
    "pyarrow>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]
docs = [
    "sphinx>=4.5.0",
    "sphinx-rtd-theme>=1.0.0",
    "numpydoc>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/NRV_HOD"
Documentation = "https://nrvpy.readthedocs.io"
Repository = "https://github.com/yourusername/NRV_HOD.git"
Issues = "https://github.com/yourusername/NRV_HOD/issues"

[tool.setuptools]
packages = ["HOD_NRV"]

[tool.setuptools.package-data]
HOD_NRV = ["*.dat", "*.txt", "data/**/*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["HOD_NRV/test"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
